<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | HR Planner</title>
  <link rel="stylesheet" href="/static/style.css" />
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #0d1b2a; color: #f5f7fb; font-family: "Inter", system-ui, sans-serif; }
    .login-card { background: #132743; padding: 32px; border-radius: 16px; width: min(420px, 92vw); box-shadow: 0 12px 40px rgba(0,0,0,0.35); }
    .login-card h1 { margin: 0 0 8px; font-size: 24px; }
    .login-card p { margin: 0 0 20px; color: #cdd7e3; }
    label { display: block; font-weight: 600; margin: 12px 0 6px; }
    input { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #2a3f5f; background: #0f2037; color: #f5f7fb; }
    button { margin-top: 18px; width: 100%; padding: 12px; border: none; border-radius: 10px; background: linear-gradient(135deg, #36a2ff, #6c5ce7); color: white; font-weight: 700; cursor: pointer; }
    button:hover { opacity: 0.96; }
    .error { margin-top: 10px; padding: 10px; background: #3d1e2b; border: 1px solid #c44b68; border-radius: 8px; color: #ffb8c9; }
    .hint { margin-top: 14px; font-size: 12px; color: #9fb2cc; text-align: center; }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>HR Planner</h1>
    <p>Please sign in to continue.</p>
    <form method="post" action="/login">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" value="admin" autocomplete="username" required />

      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required />

      <button type="submit">Sign in</button>
    </form>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <div class="hint">Default: admin / sdah1234</div>
  </div>
</body>
</html>
